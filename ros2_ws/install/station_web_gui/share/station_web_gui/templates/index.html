<!DOCTYPE html>
<html>
<head>
    <title>Sensor Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Sensor Data</h1>
        <div id="devices-container"></div>
    </div>

    <script type="text/javascript">
        var ws = new WebSocket("ws://" + window.location.host + "/ws");
        var sensorConfig = {% raw sensor_config %};
        var lastSensorValues = {% raw last_sensor_values %};

        function groupByDevice(sensors) {
            const groups = {};
            sensors.forEach(sensor => {
                const deviceId = sensor.device_id || sensor.id.split('_')[0];
                if (!groups[deviceId]) {
                    groups[deviceId] = [];
                }
                groups[deviceId].push(sensor);
            });
            return groups;
        }

        function renderDevices() {
            const container = document.getElementById('devices-container');
            container.innerHTML = '';
            const grouped = groupByDevice(sensorConfig);
            
            Object.keys(grouped).sort().forEach(deviceId => {
                const sensors = grouped[deviceId];
                const deviceName = sensors[0]?.device_name || deviceId;
                
                const deviceDiv = document.createElement('div');
                deviceDiv.className = 'device-group';
                
                const deviceTitle = document.createElement('div');
                deviceTitle.className = 'device-title';
                deviceTitle.textContent = deviceName;
                deviceDiv.appendChild(deviceTitle);
                
                const sensorsDiv = document.createElement('div');
                sensorsDiv.className = 'sensors-grid';
                
                sensors.forEach(sensor => {
                    const sensorCard = document.createElement('div');
                    sensorCard.className = 'sensor-card';
                    
                    const label = document.createElement('div');
                    label.className = 'sensor-label';
                    label.textContent = sensor.label || sensor.representation || sensor.id;
                    
                    const valueUnit = document.createElement('div');
                    valueUnit.className = 'sensor-value-unit';
                    
                    const value = document.createElement('span');
                    value.className = 'sensor-value';
                    value.id = sensor.id + '_value';
                    value.textContent = 'Loading...';
                    
                    const unit = document.createElement('span');
                    unit.className = 'sensor-unit';
                    unit.textContent = sensor.unit;
                    
                    valueUnit.appendChild(value);
                    valueUnit.appendChild(unit);
                    
                    sensorCard.appendChild(label);
                    sensorCard.appendChild(valueUnit);

                    const timestamp = document.createElement('div');
                    timestamp.className = 'sensor-timestamp';
                    timestamp.id = sensor.id + '_timestamp';
                    timestamp.textContent = 'Waiting for update...';
                    sensorCard.appendChild(timestamp);

                    sensorsDiv.appendChild(sensorCard);
                });
                
                deviceDiv.appendChild(sensorsDiv);
                container.appendChild(deviceDiv);
            });
        }

        function formatRelativeTime(isoTimestamp) {
            try {
                const timestamp = new Date(isoTimestamp).getTime();
                const seconds = Math.floor((Date.now() - timestamp) / 1000);
                if (seconds < 5) {
                    return 'Updated just now';
                }
                if (seconds < 60) {
                    return `Updated ${seconds}s ago`;
                }
                const minutes = Math.floor(seconds / 60);
                if (minutes < 60) {
                    return `Updated ${minutes} min ago`;
                }
                const hours = Math.floor(minutes / 60);
                if (hours < 24) {
                    return `Updated ${hours} hr ago`;
                }
                const days = Math.floor(hours / 24);
                return `Updated ${days} day${days === 1 ? '' : 's'} ago`;
            } catch (e) {
                return 'Updated recently';
            }
        }

        function updateTimestamp(sensorId, timestamp) {
            const element = document.getElementById(sensorId + '_timestamp');
            if (element) {
                element.textContent = formatRelativeTime(timestamp);
            }
        }

        function updateUI(sensorId, value, timestamp) {
            const element = document.getElementById(sensorId + "_value");
            if (element) {
                const num = parseFloat(value);
                element.textContent = isNaN(num) ? value : num.toFixed(2);
                updateTimestamp(sensorId, timestamp);
            }
        }

        function handleIncomingData(data) {
            if (Array.isArray(data)) {
                data.forEach(item => {
                    if (item.sensor_id) {
                        updateUI(item.sensor_id, item.value, item.timestamp);
                    }
                });
            } else if (data && data.sensor_id) {
                updateUI(data.sensor_id, data.value, data.timestamp);
            }
        }

        window.onload = function() {
            renderDevices();
            if (lastSensorValues) {
                handleIncomingData(lastSensorValues);
            }
        };

        ws.onmessage = function(event) {
            try {
                const data = JSON.parse(event.data);
                handleIncomingData(data);
            } catch (e) {
                console.error("WebSocket Error:", e);
            }
        };

        ws.onopen = function() { console.log("Connected"); };
    </script>
</body>
<footer>
<nav>
    <a href="/">Dashboard</a> | <a href="/logs">View Logs</a> | <a href="/control">Device Control</a>
</nav>
</footer>
</html>
