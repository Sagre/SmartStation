<!DOCTYPE html>
<html>
<head>
    <title>Sensor Dashboard</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="container">
        <h1>Sensor Data</h1>
        <table>
            <thead>
                <tr>
                    <th>Sensor</th>
                    <th>Value</th>
                    <th>Unit</th>
                </tr>
            </thead>
            <tbody>
                {% for sensor in sensor_config %}
                    <tr>
                        <td>{{ sensor["representation"] }}</td>  <!-- Corrected line -->
                        <td id="{{ sensor["id"] }}_value">Loading...</td> <!-- Corrected line -->
                        <td>{{ sensor["unit"] }}</td>  <!-- Corrected line -->
                    </tr>
                {% end %}
            </tbody>
        </table>
    </div>

    <script type="text/javascript">
        var ws = new WebSocket("/ws");

        ws.onopen = function(event) {
            console.log("WebSocket opened");
        };

        ws.onmessage = function(event) {
            var data = JSON.parse(event.data);
            if (data.sensor_name) {
                var element = document.getElementById(data.sensor_name + "_value"); // Use sensor_name for the ID
                if (element) {
                    element.innerText = data.value.toFixed(2);
                }
            }
        };

        ws.onclose = function(event) {
            console.log("WebSocket closed");
        };

        ws.onerror = function(error) {
            console.error("WebSocket error:", error);
        };
    </script>
</body>
</html>
