<!DOCTYPE html>
<html>
<head>
    <title>Sensor Dashboard</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="container">
        <h1>Sensor Data</h1>
        <table>
            <thead>
                <tr>
                    <th>Sensor</th>
                    <th>Value</th>
                    <th>Unit</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Temperature</td>
                    <td id="temperature_value">Loading...</td>
                    <td>°C</td>
                </tr>
                <tr>
                    <td>Humidity</td>
                    <td id="humidity_value">Loading...</td>
                    <td>%</td>
                </tr>
                <!-- Add more rows for other sensors -->
            </tbody>
        </table>
    </div>

    <script type="text/javascript">
        var ws = new WebSocket("/ws");

        ws.onopen = function(event) {
            console.log("WebSocket opened");
        };

        ws.onmessage = function(event) {
            var data = JSON.parse(event.data);
            if (data.sensor_name === "temperature") {
                document.getElementById("temperature_value").innerText = data.value.toFixed(2);
            } else if (data.sensor_name === "humidity") {
                document.getElementById("humidity_value").innerText = data.value.toFixed(2);
            }
        };

        ws.onclose = function(event) {
            console.log("WebSocket closed");
        };

        ws.onerror = function(error) {
            console.error("WebSocket error:", error);
        };
    </script>
</body>
</html>
