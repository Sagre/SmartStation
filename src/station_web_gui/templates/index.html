<!DOCTYPE html>
<html>
<head>
    <title>Temperature and Humidity</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <h1>Temperature: <span id="temperature_value">Loading...</span></h1>
    <h1>Humidity: <span id="humidity_value">Loading...</span></h1>
    <script type="text/javascript">
        var ws = new WebSocket("/ws"); // Use the correct WebSocket path

        ws.onopen = function(event) {
            console.log("WebSocket opened");
        };

        ws.onmessage = function(event) {
            var data = JSON.parse(event.data);
            if (data.sensor_name === "temperature") {
                document.getElementById("temperature_value").innerText = data.value.toFixed(2) + " °C";
            } else if (data.sensor_name === "humidity") {
                document.getElementById("humidity_value").innerText = data.value.toFixed(2) + " %";
            }
        };

        ws.onclose = function(event) {
            console.log("WebSocket closed");
        };

        ws.onerror = function(error) {
            console.error("WebSocket error:", error);
        };
    </script>
</body>
</html>
